name: Set up .NET MAUI
description: Selects Xcode, installs the .NET SDK and the maui workload (macOS runners).

inputs:
  dotnet-version:
    description: .NET SDK version, in actions/setup-dotnet syntax.
    required: false
    default: 10.0.x
  dotnet-quality:
    description: SDK quality for a prerelease channel (for example preview); empty for released SDKs.
    required: false
    default: ''
  xcode-version:
    description: Xcode version, in maxim-lobanov/setup-xcode syntax. The default matches the pinned iOS workload.
    required: false
    default: '^26.5'
  workload-versions:
    description: >-
      Rollback file with the workload manifest versions to install; empty installs the newest workloads. A new iOS
      workload requires the Xcode released with it, which the runner images get later, so the versions are pinned.
    required: false
    default: .github/workload-versions.json

runs:
  using: composite
  steps:
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        dotnet-quality: ${{ inputs.dotnet-quality }}

    - name: Install MAUI workload
      shell: bash
      env:
        WORKLOAD_VERSIONS: ${{ inputs.workload-versions }}
      run: |
        if [ -n "$WORKLOAD_VERSIONS" ]; then
          dotnet workload install maui --skip-sign-check --from-rollback-file "$WORKLOAD_VERSIONS"
        else
          dotnet workload install maui --skip-sign-check
        fi
        dotnet workload list

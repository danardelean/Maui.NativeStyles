name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET MAUI
        uses: ./.github/actions/setup-maui

      - name: Restore
        run: dotnet restore Maui.NativeStyles.slnx

      # CI builds set ContinuousIntegrationBuild (Directory.Build.props), which makes library warnings errors.
      - name: Build library (warnings as errors)
        run: dotnet build src/Maui.NativeStyles/Maui.NativeStyles.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Maui.NativeStyles.Tests/Maui.NativeStyles.Tests.csproj -c Release --no-restore

      - name: Build sample (Android)
        run: dotnet build samples/NativeStyles.Sample/NativeStyles.Sample.csproj -f net10.0-android -c Release --no-restore

      - name: Build sample (iOS simulator)
        run: dotnet build samples/NativeStyles.Sample/NativeStyles.Sample.csproj -f net10.0-ios -c Release --no-restore -p:RuntimeIdentifier=iossimulator-arm64

      - name: Pack
        run: dotnet pack src/Maui.NativeStyles/Maui.NativeStyles.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # A v* tag publishes the packages built above: GitHub release (notes from CHANGELOG.md) and, when the
  # NUGET_USER secret is configured, nuget.org through Trusted Publishing (no long-lived API key: the job's
  # GitHub OIDC token is exchanged for a one-hour key, under the policy for this repository and workflow file
  # registered on nuget.org, https://learn.microsoft.com/nuget/nuget-org/trusted-publishing).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts

      - name: Check the package version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ ! -f "artifacts/Maui.NativeStyles.$version.nupkg" ] || [ ! -f "artifacts/Maui.NativeStyles.$version.snupkg" ]; then
            echo "::error::Tag $TAG does not match the packed version: $(ls artifacts)"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          # The section starts at "## [X.Y.Z] - date" and ends at the next "## " heading.
          awk -v heading="## [$VERSION]" '
            /^## / { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION (expected a heading \"## [$VERSION] - YYYY-MM-DD\")."
            exit 1
          fi
          cat release-notes.md

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg artifacts/*.snupkg --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg \
              --verify-tag --title "$TAG" --notes-file release-notes.md $prerelease
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the nuget.org configuration
        id: nuget
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::notice title=nuget.org::The NUGET_USER secret (nuget.org profile name) is not configured: the package was not pushed to nuget.org."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The temporary key is valid for one hour, so it is requested right before the push.
      - name: Sign in to nuget.org (Trusted Publishing)
        if: steps.nuget.outputs.configured == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.nuget.outputs.configured == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # The .snupkg next to the .nupkg is pushed to the symbol server too.
          dotnet nuget push "artifacts/Maui.NativeStyles.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

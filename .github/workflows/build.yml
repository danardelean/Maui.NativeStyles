name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-sign-check

      - name: Restore
        run: dotnet restore Maui.NativeStyles.slnx

      - name: Build library
        run: dotnet build src/Maui.NativeStyles/Maui.NativeStyles.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Maui.NativeStyles.Tests/Maui.NativeStyles.Tests.csproj -c Release --no-restore

      - name: Build sample (Android)
        run: dotnet build samples/NativeStyles.Sample/NativeStyles.Sample.csproj -f net10.0-android -c Release --no-restore

      - name: Build sample (iOS simulator)
        run: dotnet build samples/NativeStyles.Sample/NativeStyles.Sample.csproj -f net10.0-ios -c Release --no-restore -p:RuntimeIdentifier=iossimulator-arm64

      - name: Pack
        run: dotnet pack src/Maui.NativeStyles/Maui.NativeStyles.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
